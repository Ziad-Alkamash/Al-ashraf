<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <defs>
    <!-- التدرج الزيتوني/المريمي الناعم للقوس الخارجي -->
    <linearGradient id="outerSageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C2CEB8"/>
      <stop offset="55%" stop-color="#DDE5D6"/>
      <stop offset="100%" stop-color="#EFF3EC" stop-opacity="0.2"/>
    </linearGradient>

    <!-- التدرج الذهبي الناعم للهلال -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C170"/>
      <stop offset="100%" stop-color="#C89D42"/>
    </linearGradient>
  </defs>

  <!-- القوس الخارجي - بتدرج زيتوني ناعم وبدون أي خطوط فاصلة -->
  <path d="M 50 650 
           L 50 280 
           C 50 180, 150 130, 210 120 
           C 235 116, 245 80, 250 50 
           C 255 80, 265 116, 290 120 
           C 350 130, 450 180, 450 280 
           L 450 650 Z" 
        fill="url(#outerSageGrad)" />

  <!-- القوس الداخلي - باللون الفاتح جداً -->
  <path d="M 130 650 
           L 130 310 
           C 130 230, 190 190, 230 180 
           C 245 177, 248 155, 250 135 
           C 252 155, 255 177, 270 180 
           C 310 190, 370 230, 370 310 
           L 370 650 Z" 
        fill="#FAF9F5" />

  <!-- الهلال الذهبي في منتصف القوس الداخلي -->
  <path d="M 250 240 
           A 22 22 0 1 0 272 262 
           A 17 17 0 1 1 250 240 Z" 
        fill="url(#goldGrad)" />
</svg>
